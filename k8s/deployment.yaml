apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-demo
  namespace: rollback-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollback-demo
  template:
    metadata:
      labels:
        app: rollback-demo
    spec:
      containers:
      - name: nginx
        image: YOUR_DOCKERHUB_USERNAME/rollback-demo:v1
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
